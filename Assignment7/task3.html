<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Background</title>
    <link rel="stylesheet" href="task3.css">
</head>

<body>

    <header>
        <h1>Gradient Background Webpage</h1>
    </header>

    <main>
        <section class="linear-section">
            <div>
                <h2>Linear Gradient</h2>
                <p>
                    This section uses a linear gradient background
                    that changes smoothly from one color to another.
                </p>
            </div>
        </section>

        <section class="radial-section">
            <div>
                <h2>Radial Gradient</h2>
                <p>
                    This section uses a radial gradient background
                    that spreads outward from the center.
                </p>
            </div>
        </section>
    </main>

    <footer>
        <p>Gradient Background Practice</p>
    </footer>

</body>
</html>
