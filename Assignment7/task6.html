<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations Showcase</title>
    <link rel="stylesheet" href="task6.css">
</head>

<body>

    <header>
        <h1>CSS Transformations Showcase</h1>
        <p>Hover over the boxes to see different transformations</p>
    </header>

    <main>
        <section class="transformations">

            <article class="item">
                <div class="box rotate-box">Rotate</div>
                <p>rotate(45deg)</p>
            </article>

            <article class="item">
                <div class="box scale-box">Scale</div>
                <p>scale(1.3)</p>
            </article>

            <article class="item">
                <div class="box translate-box">Translate</div>
                <p>translate(20px, -20px)</p>
            </article>

            <article class="item">
                <div class="box skew-box">Skew</div>
                <p>skew(15deg)</p>
            </article>

        </section>
    </main>

    <footer>
        <p>CSS Transformations Practice</p>
    </footer>

</body>
</html>
