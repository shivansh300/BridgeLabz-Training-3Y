<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="task2.css">
</head>

<body>

    <header>
        <h1>Height and Width Practice</h1>
        <p>Different CSS height and width units</p>
    </header>

    <main>
        <section class="container">

            <article class="box box-one">
                <h2>Box 1</h2>
                <p>Width: 250px</p>
                <p>Height: 200px</p>
            </article>

            <article class="box box-two">
                <h2>Box 2</h2>
                <p>Width: 40%</p>
                <p>Height: 30vh</p>
            </article>

            <article class="box box-three">
                <h2>Box 3</h2>
                <p>Width: 20em</p>
                <p>Min Height: 180px</p>
                <p>Max Width: 300px</p>
                <p>Overflow: Auto</p>
            </article>

        </section>
    </main>

    <footer>
        <p>CSS Height and Width Practice</p>
    </footer>

</body>
</html>
