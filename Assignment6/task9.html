<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="task9.css">
</head>
<body>

    <main class="container">
        <div class="card">

            <div class="card-inner">

                <div class="card-front">
                    <img src="https://picsum.photos/400/300" alt="Nature">
                    <h2>Beautiful Nature</h2>
                </div>

                <div class="card-back">
                    <h2>About Nature</h2>
                    <p>
                        Nature gives us beautiful landscapes, fresh air,
                        peaceful surroundings, and a healthy environment.
                    </p>
                </div>

            </div>

        </div>
    </main>

</body>
</html>
