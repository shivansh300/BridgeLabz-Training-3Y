<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="task4.css">
</head>
<body>

    <div class="dashboard">

        <header>
            <h1>Dashboard</h1>
        </header>

        <aside>
            <nav>
                <a href="#">Home</a>
                <a href="#">Profile</a>
                <a href="#">Analytics</a>
                <a href="#">Settings</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <main>
            <div class="box box1">
                <h2>Users</h2>
                <p>1,250</p>
            </div>

            <div class="box box2">
                <h2>Projects</h2>
                <p>48</p>
            </div>

            <div class="box box3">
                <h2>Revenue</h2>
                <p>₹85,000</p>
            </div>

            <div class="box box4">
                <h2>Performance</h2>
                <p>92%</p>
            </div>

            <div class="box box5">
                <h2>Recent Activity</h2>
                <p>12 new activities this week.</p>
            </div>
        </main>

    </div>

</body>
</html>
