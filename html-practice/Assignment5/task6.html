<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="task6.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>Explore Beautiful Places</p>
    </header>

    <main class="gallery">

        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Mountain">
            <div class="caption">Beautiful Mountains</div>
        </div>

        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Beach">
            <div class="caption">Sunny Beach</div>
        </div>

        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=800&q=80" alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&w=800&q=80" alt="City">
            <div class="caption">Amazing City</div>
        </div>

        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Lake">
            <div class="caption">Peaceful Lake</div>
        </div>

        <div class="image-box">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Sunset">
            <div class="caption">Beautiful Sunset</div>
        </div>

    </main>

</body>
</html>
