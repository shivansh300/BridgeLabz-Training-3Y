<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Selection Page</title>
</head>

<body>

    <h1>Travel Destination Selection</h1>

    <label for="country">Country:</label>
    <select id="country">
        <option>India</option>
        <option>France</option>
        <option>Japan</option>
        <option>Australia</option>
    </select>

    <br><br>

    <label for="state">State:</label>
    <select id="state">
        <option>Uttar Pradesh</option>
        <option>Delhi</option>
        <option>Maharashtra</option>
        <option>Goa</option>
    </select>

    <br><br>

    <label for="city">City:</label>
    <select id="city">
        <option>Lucknow</option>
        <option>Agra</option>
        <option>Varanasi</option>
        <option>New Delhi</option>
    </select>

    <br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option>Agra Fort</option>
        <option>Taj Mahal</option>
        <option>India Gate</option>
        <option>Gateway of India</option>
    </select>

    <p>
        My selected travel destination is India, Uttar Pradesh, Lucknow,
        and my favorite tourist place is Agra Fort.
    </p>

</body>
</html>
