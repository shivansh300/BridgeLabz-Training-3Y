<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Payment Form</title>
</head>

<body>

    <h1>Payment Form</h1>

    <form>

        <label for="cardholder">Cardholder Name:</label>
        <input
            type="text"
            id="cardholder"
            name="cardholder"
            placeholder="Enter cardholder name"
            required>

        <br><br>

        <label for="cardnumber">Card Number:</label>
        <input
            type="text"
            id="cardnumber"
            name="cardnumber"
            placeholder="Enter card number"
            required>

        <br><br>

        <label for="expiry">Expiry Date:</label>
        <input
            type="month"
            id="expiry"
            name="expiry"
            required>

        <br><br>

        <label for="cvv">CVV:</label>
        <input
            type="password"
            id="cvv"
            name="cvv"
            placeholder="Enter CVV"
            required>

        <br><br>

        <input type="submit" value="Pay Now">

    </form>

</body>

</html>
