<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Form Page</title>
</head>

<body>

    <h1>Submit Form</h1>

    <form action="result.html" method="get" target="resultFrame">

        <label for="name">Enter Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <iframe
        name="resultFrame"
        title="Form Result"
        width="100%"
        height="200">
    </iframe>

</body>

</html>
