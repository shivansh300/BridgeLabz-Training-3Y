<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="task2.css">
</head>
<body class="bg-light text-dark">

    <header class="bg-dark text-white text-center p-5">
        <div class="container">
            <h1 class="fw-bold">Shivansh Mishra</h1>
            <p class="lead mb-0">Computer Science Student & Aspiring Software Developer</p>
        </div>
    </header>

    <main>
        <section class="container text-center py-5">

            <img src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?auto=format&fit=crop&w=400&q=80"
                 alt="Profile Image"
                 class="img-fluid rounded-circle profile-image mb-4">

            <h2 class="fw-bold mt-4">Hello, I'm Shivansh</h2>

            <p class="lead mt-3 mb-4">
                I am a Computer Science student passionate about web development,
                programming, and building useful digital solutions.
            </p>

            <div class="mb-5">
                <a href="#contact" class="btn btn-primary btn-lg me-2">
                    Hire Me
                </a>

                <a href="#" class="btn btn-outline-dark btn-lg">
                    Download CV
                </a>
            </div>

            <div id="contact" class="contact-box bg-white p-5 mx-auto">
                <h3 class="fw-bold mb-3">Contact Me</h3>

                <form>
                    <div class="mb-3">
                        <input type="text"
                               class="form-control"
                               placeholder="Your Name">
                    </div>

                    <div class="mb-3">
                        <input type="email"
                               class="form-control"
                               placeholder="Your Email">
                    </div>

                    <div class="mb-3">
                        <textarea class="form-control"
                                  rows="4"
                                  placeholder="Your Message"></textarea>
                    </div>

                    <button type="submit" class="btn btn-dark px-4">
                        Send Message
                    </button>
                </form>
            </div>

        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Shivansh Mishra. All Rights Reserved.</p>
    </footer>

</body>
</html>
