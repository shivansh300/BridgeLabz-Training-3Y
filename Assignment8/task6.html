<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demonstration</title>
    <link rel="stylesheet" href="task6.css">
</head>

<body>

    <header>
        <h1>CSS Animation Demonstration</h1>
        <p>Three different CSS animations</p>
    </header>

    <main>
        <section class="animation-container">

            <div class="animation-box">
                <div class="moving-box"></div>
                <h2>Moving Box</h2>
            </div>

            <div class="animation-box">
                <div class="ball"></div>
                <h2>Bouncing Ball</h2>
            </div>

            <div class="animation-box">
                <h2 class="color-text">Color Changing Text</h2>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 CSS Animation Demo</p>
    </footer>

</body>
</html>
