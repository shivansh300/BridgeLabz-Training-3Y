<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Effects Demonstration</title>
    <link rel="stylesheet" href="task9.css">
</head>

<body>

    <header>
        <h1>Combined Effects Demonstration</h1>
        <p>Pseudo-classes, transitions and transformations</p>
    </header>

    <main>
        <section class="effects">

            <div class="effect-card">
                <h2>Button Effect</h2>
                <button class="btn">Hover Me</button>
                <p>Changes color and grows on hover.</p>
            </div>

            <div class="effect-card">
                <h2>Card Effect</h2>
                <div class="card-box">
                    <h3>Move Me</h3>
                    <p>Hover over this card.</p>
                </div>
                <p>Moves upward with a shadow.</p>
            </div>

            <div class="effect-card">
                <h2>Link Effect</h2>
                <a href="#" class="link">Explore More</a>
                <p>Changes color and size on hover.</p>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Combined Effects Demo</p>
    </footer>

</body>
</html>
