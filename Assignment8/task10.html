<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="task10.css">
</head>

<body>

    <header>
        <h1>Mini User Interface</h1>
        <p>Simple and responsive user profile form</p>
    </header>

    <main>
        <section class="card">

            <div class="image-section">
                <img src="https://picsum.photos/200" alt="Profile Image">
            </div>

            <div class="form-section">
                <h2>Create Profile</h2>

                <form>

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" placeholder="Enter your name">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" rows="4" placeholder="Write your message"></textarea>
                    </div>

                    <div class="buttons">
                        <button type="submit" class="submit-btn">Submit</button>
                        <button type="reset" class="reset-btn">Reset</button>
                    </div>

                </form>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mini User Interface</p>
    </footer>

</body>
</html>
