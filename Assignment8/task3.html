<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="task3.css">
</head>

<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Explore beautiful places through images</p>
    </header>

    <main>
        <section class="gallery">

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1015/600/400" alt="Mountain">
                    <div class="overlay"></div>
                </div>
                <figcaption>Beautiful Mountain</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1016/600/400" alt="Forest">
                    <div class="overlay"></div>
                </div>
                <figcaption>Green Forest</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1018/600/400" alt="River">
                    <div class="overlay"></div>
                </div>
                <figcaption>Peaceful River</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1020/600/400" alt="Nature">
                    <div class="overlay"></div>
                </div>
                <figcaption>Wild Nature</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1039/600/400" alt="Lake">
                    <div class="overlay"></div>
                </div>
                <figcaption>Beautiful Lake</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1043/600/400" alt="Beach">
                    <div class="overlay"></div>
                </div>
                <figcaption>Sunny Beach</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Image Showcase</p>
    </footer>

</body>
</html>
