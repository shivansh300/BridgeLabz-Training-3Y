<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="task2.css">
</head>

<body>

    <header>
        <h1>Tooltip Demonstration</h1>
        <p>Hover over the elements to see the tooltips</p>
    </header>

    <main>
        <section class="tooltip-container">

            <div class="tooltip">
                HTML
                <span class="tooltip-text">HyperText Markup Language</span>
            </div>

            <div class="tooltip">
                CSS
                <span class="tooltip-text">Cascading Style Sheets</span>
            </div>

            <div class="tooltip">
                Java
                <span class="tooltip-text">A popular programming language</span>
            </div>

            <div class="tooltip">
                Git
                <span class="tooltip-text">Version control system</span>
            </div>

            <div class="tooltip">
                GitHub
                <span class="tooltip-text">Platform for hosting code</span>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tooltip Demo</p>
    </footer>

</body>
</html>
