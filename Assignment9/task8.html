
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="task8.css">
</head>
<body>

    <header>
        <h1>Before & After</h1>
        <p>Compare images with CSS filters</p>
    </header>

    <main>
        <section class="comparison">

            <figure class="image-card">
                <img src="https://picsum.photos/id/1015/700/450" alt="Original mountain image">
                <figcaption>Before - Original Image</figcaption>
            </figure>

            <figure class="image-card">
                <img class="filtered" src="https://picsum.photos/id/1015/700/450" alt="Filtered mountain image">
                <figcaption>After - Filtered Image</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Filter Comparison</p>
    </footer>

</body>
</html>
